version: 2.1

jobs:
  structure-aware-fuzz:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Configure
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run:
          name: Build
          command: cmake --build build --target structure-aware-fuzz -j2
      - run:
          name: Structure aware fuzz
          command: LIONSS_LP=1 ./build/structure-aware-fuzz
